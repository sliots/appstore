name: Sync upstream release

on:
  schedule:
    # UTC 01:17 = Asia/Shanghai 09:17
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check latest upstream release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          npm run release:sync --
          --output-dir "$RUNNER_TEMP/signall-release"
          --manifest-output "$RUNNER_TEMP/signall-release/manifest.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Validate updated metadata and build
        if: steps.release.outputs.updated == 'true'
        env:
          PUBLIC_BASE_URL: https://signall.example.com
          R2_PUBLIC_BASE_URL: https://ipa.example.com
        run: |
          npm run validate
          npm run typecheck
          npm test
          npm run build

      - name: Upload IPA to R2
        if: steps.release.outputs.updated == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'signall-ipa' }}
          RELEASE_MANIFEST: ${{ steps.release.outputs.manifest }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi
          while IFS= read -r update; do
            file="$(jq -r '.file' <<<"$update")"
            key="$(jq -r '.key' <<<"$update")"
            npm run ipa:upload -- --file "$file" --key "$key" --bucket "$R2_BUCKET"
          done < <(jq -c '.updates[]' "$RELEASE_MANIFEST")

      - name: Commit synchronized release
        if: steps.release.outputs.updated == 'true'
        env:
          RELEASE_VERSIONS: ${{ steps.release.outputs.versions }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/apps.json
          git commit -m "chore: sync upstream releases ${RELEASE_VERSIONS}"
          git push

      - name: Verify deployed source
        if: steps.release.outputs.updated == 'true'
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || 'https://signall-app-source.pages.dev' }}
          RELEASE_VERSIONS: ${{ steps.release.outputs.versions }}
        run: >-
          npm run verify:public --
          "$PUBLIC_BASE_URL/appstore"
          --expected-version "$RELEASE_VERSIONS"
          --attempts 12
          --delay 10000
