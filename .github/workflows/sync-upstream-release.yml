name: Sync upstream release

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check latest upstream release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_REPOSITORY: huamurui/zhihu-minus-minus
        run: >-
          npm run release:sync --
          --output-dir "$RUNNER_TEMP/signall-release"
          --github-output "$GITHUB_OUTPUT"

      - name: Validate updated metadata and build
        if: steps.release.outputs.updated == 'true'
        env:
          PUBLIC_BASE_URL: https://signall.example.com
          R2_PUBLIC_BASE_URL: https://ipa.example.com
        run: |
          npm run validate
          npm run typecheck
          npm test
          npm run build

      - name: Upload IPA to R2
        if: steps.release.outputs.updated == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'signall-ipa' }}
          RELEASE_FILE: ${{ steps.release.outputs.file }}
          RELEASE_KEY: ${{ steps.release.outputs.key }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi
          npm run ipa:upload -- --file "$RELEASE_FILE" --key "$RELEASE_KEY" --bucket "$R2_BUCKET"

      - name: Commit synchronized release
        if: steps.release.outputs.updated == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/apps.json
          git commit -m "chore: sync 知乎-- v${RELEASE_VERSION}"
          git push

      - name: Verify deployed source
        if: steps.release.outputs.updated == 'true' && vars.PUBLIC_BASE_URL != ''
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          npm run verify:public --
          "$PUBLIC_BASE_URL/appstore"
          --expected-version "$RELEASE_VERSION"
          --attempts 12
          --delay 10000
